# The crane_ml sim as a vessel: blastoise's facts on this machine only, on a private ROS domain, with its own
# state file and data dir so a sim run never touches the boat's values.
extends: blastoise
kind: vessel
network_env: network.env
registry: devices.yaml
astro:
  state: ~/.config/mhseals/hardware_sim.yaml
  data: bags/sim
  sim: '${CRANE_DIR:-~/crane_ml}/bin/crane sim'   # the sim backend; astro exports this profile's env
  field: {auto: false}   # sim runs file no automatic issues (astro issue still works)
  stacks:       # the sim backend already runs sensors, perception and Nav2 (device.launch device:=sim)
    sensors: {run: null, ready: [/odom/local]}
    perception: {run: null, ready: [/points, /front_camera/camera_info]}
    drive: {run: ros2 launch mhseals_hardware drive.launch.py output_backend:=topic use_sim_time:=true}
    nav: {run: null}

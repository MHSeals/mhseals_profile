# The fleet's members and the links between them. nodes must list every member with its kind; a link's
# via names MEMBER.KIND, the device kind that carries it. Later: a blastoise-squirtle mesh link, with
# per-link subnet and ROS domain keys (squirtle must not reuse 192.168.0.0/24 or blastoise's domain).
# control_station is a role: every operator machine on a boat LAN is one end of that boat's link.
nodes: {blastoise: vessel, squirtle: vessel, control_station: station}
links:
  - {between: [control_station, blastoise], medium: airmax, via: blastoise.radio}

# Velodyne VLP16 over its HTTP API, on the boat's network env. The sensor facts (model, MAC, rpm) are the
# vessel's (its profile.yaml lidar:).
driver: lidar/vlp16
address: $LIDAR_IP              # checked, never posted
model:                          # the boat's sensor
mac:
rpm:                            # 300-1200 in steps of 60
netmask: $NETMASK
gateway: $ROUTER_IP
data_host: $CAMERA_HOST_IP      # the host running the driver (unicast keeps the data off the radio link)
data_port: 2368
telemetry_port: 8308
returns: Strongest              # Strongest, Last or Dual (Dual doubles the packet rate)
fov: {start: 0, end: 359}
jump: LIDAR_JUMP                # secrets key of an optional ssh host on the LAN

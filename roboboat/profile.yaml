# RoboBoat, competition-wide: the repositories, device drivers and defaults every boat shares. A boat
# profile (blastoise, squirtle) extends it with its network env, host registry, radios, lidar and Jetson.
# astro (astro_dock's CLI): pointers to the team's files, no content of its own.
astro:
  tests: mhseals_hardware/config/tests.yaml   # procedures (package-relative)
  bags:  mhseals_nav/config/bags.yaml         # bag presets
  state: ~/.config/mhseals/hardware.yaml      # what apply writes
  state_env: MHSEALS_HARDWARE_CONFIG          # astro also exports the state path under this name (Nav2, hardware nodes)
  check: ros2 run mhseals_hardware config_check   # validates state after apply
  events: /events
  home: boat_computer                         # where test/rec/mark/apply/status/log/bundle run: a host shell without ROS forwards them there (--here: don't)
  data: null                                  # data dir: ASTRO_DATA unless a vessel sets one (workspace-relative)
  sim: null                                   # sim backend command (`astro sim up|down|status|check`); the sim vessel sets it
  instance_env: null                          # the sim backend's instance variable (ASTRO_SIM_INSTANCE=N); the sim vessel sets it
  help: ['${CRANE_DIR:-~/crane_ml}/help.yaml']   # more help.yaml groups: crane's verbs (astro crane doctor, ...)
  bundle_next: 'next: astro crane fit {bundle}'  # printed after astro bundle
  test_needs: [localization, drive]   # stacks `astro test` starts first when down; a test's own needs in tests.yaml replace them
  field: {repo: MHSeals/mhseals_field, url: 'https://github.com/MHSeals/mhseals_field.git',
          dir: ~/.local/share/astro/field, auto: true}   # astro check/issue/sync/show; auto: issues from failures
  # The long-running stacks `astro up` starts, in this order, each on its host (registry host or role) in a
  # private tmux server or under setsid; up waits until the ready topics publish. run: null = started elsewhere.
  stacks:
    localization:   # MAVROS, the robot TF and the EKFs
      host: boat_computer
      run: ros2 launch mhseals_nav device.launch.py device:=odroid only:=localization
      ready: [/odom/local, /mavros/rc/in]
      needs: []
      default: true
      with: {}
    perception:     # camera, objects, lidar and host_diagnostic
      host: camera_host
      run: ros2 launch mhseals_nav device.launch.py device:=jetson
      ready: [/points, /front/zed_node/rgb/color/rect/camera_info, /perception/costmap_updates]   # what Nav2 reads (updates come every cycle; the full grid only on a move)
      needs: []
      default: true
      with: {}
    drive:          # command mux, mixer and thruster output
      host: boat_computer
      run: ros2 launch mhseals_hardware drive.launch.py
      ready: [/command_mux/state, /thrusters/pwm]
      needs: []                     # driver and mux need no odometry; the velocity controller's users (tests, trial) need localization
      default: true
      with: {controller: 'controller:=true'}
    nav:            # Nav2
      host: boat_computer
      run: ros2 launch mhseals_nav device.launch.py device:=odroid only:=navigation
      ready: [/local_costmap/costmap_updates]   # the full grid is latched once (transient local); updates come every cycle
      needs: [localization, perception]   # its costmap holds only what /perception/costmap sends: without it Nav2 is blind
      default: false
      with: {pool: 'preset:=pool', lake: 'preset:=lake'}   # mhseals_nav config/nav2_presets/<name>.yaml
    mapping:        # RTAB-Map
      host: boat_computer
      run: ros2 launch mhseals_nav device.launch.py device:=odroid only:=mapping
      ready: [/mapData]
      needs: [localization, perception]   # RTAB-Map reads the camera and /points
      default: false
      with: {}
    mission:        # the RoboBoat mission tree
      host: boat_computer
      run: ros2 run mhseals_nav run_task --task mission
      ready: [/task/status]
      needs: [drive, nav]
      default: false
      with: {}

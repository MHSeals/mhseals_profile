# Blastoise: the boat with the DD-WRT router, Orin Nano Super (blastoise-jetson), ODROID (blastoise-odroid),
# ZED 2i, VLP16, CubeOrange FCU and Ubiquiti radios. Paths are relative to this directory. Vessel facts only:
# addresses in network.env, hosts and roles in devices.yaml, device facts here (over roboboat's KIND.yaml).
extends: roboboat
kind: vessel
network_env: network.env
registry: devices.yaml
lidar: {model: VLP16, mac: 60:76:88:38:35:85, rpm: 600}   # VLP-16-A, firmware 3.0.41.1
# The hull as the TUI draws it (metres): two pontoons 0.23 wide on centrelines 0.66 apart (the URDF's hull links),
# bridged by the 0.63 long cross-bar deck; length with the thrusters.
hull: {shape: catamaran, length: 1.34, beam: 0.9, pontoon: 0.23, deck: 0.63}
